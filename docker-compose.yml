version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegisfin-compliance-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - aegisfin-network

  redis-cache:
    image: redis:7-alpine
    container_name: aegisfin-redis-state
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - aegisfin-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aegisfin-compliance-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aegisfin-network

networks:
  aegisfin-network:
    driver: bridge
